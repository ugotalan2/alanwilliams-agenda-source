spring.application.name=alanwilliams-agenda

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

alanwilliams.security.clerk.issuer=${CLERK_ISSUER}
alanwilliams.security.clerk.authorized-parties=${CLERK_AUTHORIZED_PARTIES}

server.servlet.context-path=/agenda

agenda.frontend-url=${AGENDA_FRONTEND_URL:http://localhost:5173}
alanwilliams.email.api-key=${RESEND_API_KEY}
alanwilliams.email.from-name=AlanWilliams Agenda